name: Then Us preview deployment checks
on:
  pull_request:
    paths:
      - 'geuttae-uri/**'
      - '.github/workflows/geuttae-preview-checks.yml'
  push:
    branches: [main]
    paths:
      - 'geuttae-uri/**'
      - '.github/workflows/geuttae-preview-checks.yml'
permissions:
  contents: read
concurrency:
  group: then-us-preview-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check JavaScript syntax including all boot loaders
        run: |
          for file in geuttae-uri/boot-v*.js; do node --check "$file"; done
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find geuttae-uri/releases -type f -name '*.js' -print0)
      - name: Run locale, frontend and deployment-integrity regression tests
        run: |
          npm test --prefix geuttae-uri
          python3 -m unittest discover -s geuttae-uri/tests -p '*_test.py' -v
      - name: Install pinned browser QA dependencies
        working-directory: geuttae-uri
        run: npm ci
      - name: Install Chromium
        working-directory: geuttae-uri
        run: npx playwright install --with-deps chromium
      - name: Verify Korean and English startup, switching and persistence locally
        working-directory: geuttae-uri
        run: node tests/preview-home-qa.mjs
      # PRs test their own source locally; only main is compared to the public deployment.
      - name: Verify the published HTTPS files match this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python3 geuttae-uri/tools/check-preview-files.py
      - name: Verify Korean and English on the rendered public homepage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: geuttae-uri
        env:
          PREVIEW_BASE_URL: https://bumblev95.github.io/geuttae-uri/
        run: node tests/preview-home-qa.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: then-us-preview-qa
          path: geuttae-uri/tests/qa-output/preview-*/
          retention-days: 7
      - name: Summarize successful verification
        if: success()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            echo 'Public HTTPS source hashes and Korean/English Chromium homepage checks passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Local Korean/English Chromium and regression checks passed. Public deployment is checked after merge on main.' >> "$GITHUB_STEP_SUMMARY"
          fi
