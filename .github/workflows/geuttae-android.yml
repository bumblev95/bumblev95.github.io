name: Then Us Android APK
on:
  pull_request:
    paths: ['geuttae-uri/mobile/**', 'geuttae-uri/releases/0.5.0/**', 'geuttae-uri/assets/**', 'geuttae-uri/index.html', '.github/workflows/geuttae-android.yml']
  push:
    branches: [main]
    paths: ['geuttae-uri/mobile/**', 'geuttae-uri/releases/0.5.0/**', 'geuttae-uri/assets/**', 'geuttae-uri/index.html', '.github/workflows/geuttae-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Build bundled app
        working-directory: geuttae-uri/mobile
        run: |
          npm ci
          npm run sync
          npm test
      - name: Verify bundled mobile flows
        working-directory: geuttae-uri
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node mobile/tests/browser-qa.mjs
      - name: Install Android SDK packages
        run: |
          sdk_root="$RUNNER_TEMP/then-us-android-sdk"
          mkdir -p "$sdk_root/cmdline-tools"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          echo "7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/then-us-tools"
          mv "$RUNNER_TEMP/then-us-tools/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'

      - name: Assemble installable test APK and lint
        working-directory: geuttae-uri/mobile/android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - name: Package app
        run: |
          mkdir -p android-delivery
          cp geuttae-uri/mobile/android/app/build/outputs/apk/debug/app-debug.apk android-delivery/Then-Us-TEST-v0.5.0.apk
          cp geuttae-uri/mobile/README.md android-delivery/README.md
          sha256sum android-delivery/*.apk > android-delivery/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Then-Us-TEST-v0.5.0
          path: android-delivery/
          retention-days: 30
