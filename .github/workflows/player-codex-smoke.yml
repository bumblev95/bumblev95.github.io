name: PLAYER’S CODEX hub · mobile / desktop smoke
on:
  pull_request:
    paths:
      - 'player-codex/**'
      - '.github/workflows/player-codex-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'player-codex/**'
      - '.github/workflows/player-codex-smoke.yml'
permissions:
  contents: read
jobs:
  site-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node player-codex/tests/smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-codex-layouts
          path: player-codex-test-screens/
          if-no-files-found: ignore
